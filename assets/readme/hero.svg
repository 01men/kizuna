<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Kizuna — a letterbox for every agent</title>
  <desc id="d">Tasks travel from Agent A through the kizuna-hub postbox to Agent B's letterbox; a dashed arc returns the ACK receipt, another shows the retry ladder at +3, +10, +30, +60 and +120 minutes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6F0"/>
      <stop offset="1" stop-color="#EFF5FF"/>
    </linearGradient>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8A90A0"/>
    </marker>
    <marker id="aSakura" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF7FA5"/>
    </marker>
    <marker id="aSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5B8DEF"/>
    </marker>
    <path id="heart" d="M0 10 C-7.5 3 -11 -0.5 -11 -4.6 C-11 -7.6 -8.8 -9.5 -6.4 -9.5 C-4.4 -9.5 -2.6 -8.4 0 -5.8 C2.6 -8.4 4.4 -9.5 6.4 -9.5 C8.8 -9.5 11 -7.6 11 -4.6 C11 -0.5 7.5 3 0 10 Z"/>
    <path id="spark" d="M0 -9 C1.5 -3 3 -1.5 9 0 C3 1.5 1.5 3 0 9 C-1.5 3 -3 1.5 -9 0 C-3 -1.5 -1.5 -3 0 -9 Z"/>
  </defs>

  <g font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">

    <rect x="0" y="0" width="1200" height="600" rx="24" fill="url(#bg)"/>
    <use href="#spark" transform="translate(596,84) scale(0.8)" fill="#FF9DBB" opacity="0.55"/>
    <use href="#spark" transform="translate(1158,470) scale(0.7)" fill="#9DBBFF" opacity="0.5"/>
    <use href="#spark" transform="translate(36,540) scale(0.6)" fill="#FF9DBB" opacity="0.4"/>
    <use href="#spark" transform="translate(620,548) scale(0.6)" fill="#9DBBFF" opacity="0.45"/>

    <!-- brand block -->
    <text x="72" y="126" font-size="21" font-weight="700" letter-spacing="6" fill="#E56B93">キズナ ・ 絆</text>
    <text x="68" y="222" font-size="96" font-weight="800" letter-spacing="-2" fill="#2F3140">Kizuna</text>
    <path d="M74 246 C 160 262, 260 228, 352 250" stroke="#FF9DBB" stroke-width="5" fill="none" stroke-linecap="round"/>
    <use href="#heart" transform="translate(368,242) scale(1.7)" fill="#FF7FA5"/>
    <text x="72" y="300" font-size="28" font-weight="700" fill="#2F3140">A letterbox for every agent.</text>
    <text x="72" y="340" font-size="21" fill="#6B7280">给每个 Agent 一个信箱，每一封信都有回执。</text>

    <!-- journey card -->
    <rect x="640" y="64" width="512" height="360" rx="24" fill="#FFFFFF" stroke="#ECEEF3" stroke-width="1.5"/>
    <text x="664" y="102" font-size="20" font-weight="700" letter-spacing="3" fill="#8A90A0">HOW A LETTER TRAVELS</text>

    <!-- agent A -->
    <rect x="668" y="140" width="88" height="88" rx="20" fill="#FFF" stroke="#FF9DBB" stroke-width="3"/>
    <circle cx="696" cy="182" r="4" fill="#2F3140"/>
    <circle cx="728" cy="182" r="4" fill="#2F3140"/>
    <path d="M700 200 Q712 210 724 200" stroke="#2F3140" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="712" y="256" font-size="20" font-weight="600" fill="#2F3140" text-anchor="middle">Agent A</text>

    <!-- hub postbox -->
    <rect x="792" y="112" width="140" height="30" rx="15" fill="#C94B4B"/>
    <text x="862" y="133" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">kizuna-hub</text>
    <path d="M828 246 V208 a34 34 0 0 1 68 0 V246 Z" fill="#E85D5D"/>
    <rect x="844" y="192" width="36" height="7" rx="3.5" fill="#FFF"/>
    <rect x="822" y="246" width="80" height="9" rx="4.5" fill="#C94B4B"/>

    <!-- agent B -->
    <rect x="1000" y="140" width="88" height="88" rx="20" fill="#FFF" stroke="#9DBBFF" stroke-width="3"/>
    <circle cx="1028" cy="182" r="4" fill="#2F3140"/>
    <circle cx="1060" cy="182" r="4" fill="#2F3140"/>
    <path d="M1032 200 Q1044 210 1056 200" stroke="#2F3140" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="1044" y="256" font-size="20" font-weight="600" fill="#2F3140" text-anchor="middle">Agent B</text>

    <!-- dispatch arrows -->
    <path d="M762 184 L814 184" stroke="#8A90A0" stroke-width="3" marker-end="url(#aGray)"/>
    <text x="788" y="170" font-size="18" fill="#6B7280" text-anchor="middle">task</text>
    <path d="M904 184 L986 184" stroke="#8A90A0" stroke-width="3" marker-end="url(#aGray)"/>
    <text x="948" y="170" font-size="18" fill="#6B7280" text-anchor="middle">deliver</text>

    <!-- ACK return -->
    <path d="M1044 264 C 1044 318, 862 318, 862 272" stroke="#FF7FA5" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#aSakura)"/>
    <text x="953" y="338" font-size="20" font-weight="700" fill="#E56B93" text-anchor="middle">ACK</text>

    <!-- retry ladder -->
    <path d="M866 352 C 866 396, 1044 396, 1044 284" stroke="#5B8DEF" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#aSky)"/>
    <text x="955" y="416" font-size="18" font-weight="600" fill="#5B8DEF" text-anchor="middle">+3 · +10 · +30 · +60 · +120 min</text>

    <!-- feature chips -->
    <g font-size="19" font-weight="700" letter-spacing="2">
      <rect x="96" y="470" width="210" height="52" rx="26" fill="#FFFFFF" opacity="0.8" stroke="#ECEEF3" stroke-width="1.5"/>
      <circle cx="122" cy="496" r="5" fill="#FF7FA5"/>
      <text x="140" y="503" fill="#2F3140">DIRECTORY</text>

      <rect x="342" y="470" width="210" height="52" rx="26" fill="#FFFFFF" opacity="0.8" stroke="#ECEEF3" stroke-width="1.5"/>
      <circle cx="368" cy="496" r="5" fill="#5B8DEF"/>
      <text x="386" y="503" fill="#2F3140">LETTERBOX</text>

      <rect x="588" y="470" width="150" height="52" rx="26" fill="#FFFFFF" opacity="0.8" stroke="#ECEEF3" stroke-width="1.5"/>
      <circle cx="614" cy="496" r="5" fill="#E85D5D"/>
      <text x="632" y="503" fill="#2F3140">RELAY</text>

      <rect x="774" y="470" width="330" height="52" rx="26" fill="#FFFFFF" opacity="0.8" stroke="#ECEEF3" stroke-width="1.5"/>
      <circle cx="800" cy="496" r="5" fill="#FF7FA5"/>
      <text x="818" y="503" fill="#2F3140">NEVER LOSES A LETTER</text>
    </g>
  </g>
</svg>
