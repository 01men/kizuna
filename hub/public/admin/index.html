<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kizuna · 管理台</title>
<link rel="stylesheet" href="/admin/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='2' y='3' width='16' height='14' rx='3' fill='%23FF7FA5'/%3E%3Cpath d='M5 8h10M5 11h7' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app">
  <!-- 登录态 -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="44" height="44"><rect x="2" y="3" width="16" height="14" rx="3" fill="var(--accent)"/><path d="M5 8h10M5 11h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <h1>Kizuna 管理台</h1>
      <p class="muted">Agent 通讯录与任务可靠投递</p>
      <label for="login-token">管理员令牌</label>
      <input id="login-token" type="password" placeholder="kad_… / 环境变量 KIZUNA_ADMIN_TOKEN" required>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn primary">进入管理台</button>
    </form>
  </div>

  <!-- 主框架：左列 240px + 右列内容 -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 20 20" width="26" height="26" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3" fill="var(--accent)"/><path d="M5 8h10M5 11h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Kizuna</span>
      </div>
      <nav id="nav" class="nav" aria-label="主导航">
        <a href="#/overview" data-nav="overview">总览</a>
        <a href="#/agents"   data-nav="agents">通讯录</a>
        <a href="#/queue"    data-nav="queue">任务队列</a>
        <a href="#/audit"    data-nav="audit">投递留痕</a>
        <a href="#/install"  data-nav="install">安装部署</a>
        <a href="#/settings" data-nav="settings">设置</a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted" id="hub-origin"></span>
        <button id="logout" class="btn ghost small" type="button">退出</button>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/admin/app.js"></script>
</body>
</html>
